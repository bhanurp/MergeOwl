name: Bug report
description: Report a reproducible problem in MergeOwl
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "GitHub issues are public. Do not include tokens, private repository or organization names, secrets in logs, screenshots, or URLs, or confidential or personal data."
  - type: input
    id: version
    attributes:
      label: MergeOwl version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open MergeOwl\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.0"
    validations:
      required: true
