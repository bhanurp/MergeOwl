name: Build and Publish macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-15
    env:
      PRODUCT_NAME: MergeOwl
      APP_BUNDLE_ID: io.bhanurp.prpulse
      MIN_MACOS_VERSION: "14.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run test suite
        run: swift test

      - name: Run installer tests
        run: |
          bash Tests/InstallerTests/test_install_latest_release.sh
          bash Tests/InstallerTests/test_install_prpulse.sh

      - name: Build app bundle
        shell: bash
        run: |
          set -euo pipefail

          RAW_VERSION="${GITHUB_REF_NAME:-0.1.0-dev}"
          VERSION="${RAW_VERSION#v}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

          echo "Building arm64 binary..."
          swift build -c release --arch arm64 --product "$PRODUCT_NAME" --scratch-path .build-arm64
          BIN_ARM64="$(swift build -c release --arch arm64 --product "$PRODUCT_NAME" --show-bin-path --scratch-path .build-arm64)"

          BIN_PATH="$BIN_ARM64"
          if swift build -c release --arch x86_64 --product "$PRODUCT_NAME" --scratch-path .build-x86_64; then
            echo "Building x86_64 binary..."
            BIN_X86_64="$(swift build -c release --arch x86_64 --product "$PRODUCT_NAME" --show-bin-path --scratch-path .build-x86_64)"
            USE_UNIVERSAL=1
          else
            echo "warning: x86_64 build failed; shipping arm64-only app from this run" >&2
            USE_UNIVERSAL=0
          fi

          mkdir -p dist
          APP_BUNDLE="dist/${PRODUCT_NAME}.app"
          APP_CONTENTS="${APP_BUNDLE}/Contents"
          APP_MACOS="${APP_CONTENTS}/MacOS"
          APP_RESOURCES="${APP_CONTENTS}/Resources"
          mkdir -p "$APP_MACOS" "$APP_RESOURCES"

          if [[ "$USE_UNIVERSAL" == "1" ]]; then
            lipo -create \
              "$BIN_ARM64/$PRODUCT_NAME" \
              "$BIN_X86_64/$PRODUCT_NAME" \
              -output "$APP_MACOS/$PRODUCT_NAME"
            ARCH_LABEL="universal"
          else
            cp "$BIN_ARM64/$PRODUCT_NAME" "$APP_MACOS/$PRODUCT_NAME"
            ARCH_LABEL="arm64"
          fi
          chmod +x "$APP_MACOS/$PRODUCT_NAME"

          find "$BIN_PATH" -maxdepth 1 -type d -name '*.bundle' -exec cp -R {} "$APP_RESOURCES" \;
          cp Sources/PRPulseApp/Resources/MergeOwl.icns "$APP_RESOURCES/MergeOwl.icns"

          cat > "${APP_CONTENTS}/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>MergeOwl</string>
            <key>CFBundleExecutable</key>
            <string>MergeOwl</string>
            <key>CFBundleIdentifier</key>
            <string>${APP_BUNDLE_ID}</string>
            <key>CFBundleName</key>
            <string>MergeOwl</string>
            <key>CFBundleIconFile</key>
            <string>MergeOwl.icns</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${BUILD_NUMBER}</string>
            <key>LSMinimumSystemVersion</key>
            <string>${MIN_MACOS_VERSION}</string>
            <key>LSUIElement</key>
            <true/>
          </dict>
          </plist>
          PLIST

          # No Developer ID available yet; ad-hoc sign to improve local integrity checks.
          codesign --force --deep --sign - "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"

          ZIP_VERSIONED="${PRODUCT_NAME}-${VERSION}-macOS-${ARCH_LABEL}.zip"
          ZIP_ALIAS="${PRODUCT_NAME}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" "dist/${ZIP_VERSIONED}"
          cp "dist/${ZIP_VERSIONED}" "dist/${ZIP_ALIAS}"
          cp "dist/${ZIP_VERSIONED}" dist/PRPulseApp.zip

          DMG_VERSIONED="${PRODUCT_NAME}-${VERSION}-macOS-${ARCH_LABEL}.dmg"
          DMG_ALIAS="${PRODUCT_NAME}.dmg"
          DMG_ROOT="dist/dmg-root"
          rm -rf "$DMG_ROOT"
          mkdir -p "$DMG_ROOT"
          cp -R "$APP_BUNDLE" "$DMG_ROOT/"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "MergeOwl" -srcfolder "$DMG_ROOT" -ov -format UDZO "dist/${DMG_VERSIONED}"
          codesign --force --sign - "dist/${DMG_VERSIONED}"
          cp "dist/${DMG_VERSIONED}" "dist/${DMG_ALIAS}"
          cp "dist/${DMG_VERSIONED}" dist/PRPulseApp.dmg

          echo "ARCH_LABEL=${ARCH_LABEL}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        uses: softprops/action-gh-release@v2
        with:
          name: MergeOwl ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            dist/MergeOwl.dmg
            dist/MergeOwl.zip
            dist/MergeOwl-*-macOS-*.dmg
            dist/MergeOwl-*-macOS-*.zip
            dist/PRPulseApp.dmg
            dist/PRPulseApp.zip
