name: PRPulseE2E
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: YES
    PRPULSE_E2E_HOSTED_CI: "false"
targets:
  PRPulseE2EApp:
    type: application
    platform: macOS
    sources:
      - path: ../../Sources/PRPulseApp
        excludes: ["**/README.md", "Resources"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.prpulse.e2e
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) E2E_TESTING"
    info:
      path: Generated/AppInfo.plist
      properties:
        CFBundleDisplayName: PR Pulse
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
  PRPulseUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [PRPulseUITests.swift, ../PRPulseAppTests/HostedNoticeSelectors.swift]
    dependencies:
      - target: PRPulseE2EApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.prpulse.e2e.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PRPulseE2EApp
schemes:
  PRPulseE2E:
    build:
      targets:
        PRPulseE2EApp: all
        PRPulseUITests: [test]
    test:
      environmentVariables:
        PRPULSE_E2E_HOSTED_CI: $(PRPULSE_E2E_HOSTED_CI)
      targets:
        - name: PRPulseUITests
          parallelizable: false
